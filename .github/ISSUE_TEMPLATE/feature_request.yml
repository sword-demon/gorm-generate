name: 功能请求
description: 希望应用支持的能力
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看一眼 README 的「已知限制」：不生成 DTO、事务模板、关联预加载与自定义模板，不连接数据库，目前只支持 MySQL 与 PostgreSQL 的 `CREATE TABLE` / `COMMENT ON`。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪一步，为什么需要这个能力。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 如果有具体的命令、选项或输出形态，写在这里。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 目前怎么绕过这个问题；有没有别的工具已经做得很好。
