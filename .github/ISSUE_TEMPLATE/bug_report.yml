name: Bug 报告
description: 应用的行为与预期不符
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **提交前请确认：** 粘贴的 DDL 会公开可见。请去掉表名与注释里的业务信息，只保留复现所需的最小结构。

        可复现的问题请务必给出最小 DDL；同一版本、同一类报错会在 triage 阶段合并，不需要重复提交。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: Release 标签或应用内的版本号。
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: dialect
    attributes:
      label: 方言
      options:
        - MySQL
        - PostgreSQL
    validations:
      required: true
  - type: dropdown
    id: cache
    attributes:
      label: 缓存开关
      options:
        - 关闭
        - 开启（Redis）
    validations:
      required: true
  - type: textarea
    id: ddl
    attributes:
      label: 最小 DDL 片段（已脱敏）
      render: sql
      placeholder: CREATE TABLE `users` (`id` BIGINT NOT NULL, PRIMARY KEY (`id`));
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 报错原文、截图或生成结果，越多越好。
    validations:
      required: true
