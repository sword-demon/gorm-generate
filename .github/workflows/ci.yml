name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  core:
    name: core (unit + regressions + go build matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Toolchain pinned to the version used locally (`rustc -V` = 1.90.0).
      # Installed directly via rustup (preinstalled on ubuntu runners) instead
      # of a third-party toolchain action.
      - name: Install Rust 1.90.0
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          rustup default 1.90.0

      # Source cache only: no target/ cache, so stale artifacts can never mask
      # a compile error.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false

      # The generated projects pin their own go.mod (crates/core/tests/compile.rs),
      # so there is no repo go.sum to hash. Bump this key when those require
      # versions change.
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: gomod-gorm-v1.31.2-redis-v9.7.0

      # Fails fast on lint drift; the 4 pre-existing golden-test warnings were
      # cleaned up when this step landed. No fmt check: the repo is not
      # rustfmt-formatted and a fmt gate would stay red.
      - name: cargo clippy -D warnings
        run: cargo clippy -p gorm-generate-core --all-targets -- -D warnings

      - name: cargo test --lib
        run: cargo test -p gorm-generate-core --lib

      - name: cargo test review_regressions
        run: cargo test -p gorm-generate-core --test review_regressions

      # Pins the IPC wire format, which only exists with the serde feature
      # (ADR-0004); the default build above proves core stays serde-free.
      - name: cargo test wire_format (serde feature)
        run: cargo test -p gorm-generate-core --test wire_format --features serde

      # Needs Go on PATH and network for `go mod tidy` inside each temp project.
      - name: cargo test compile (go build matrix)
        run: cargo test -p gorm-generate-core --test compile

  # The Tauri wrapper has its own unit tests (export root confirmation, export
  # failure wire format). Compiling it on Linux needs the system libraries the
  # app links against; the debug build reads devUrl, so no frontend build is
  # needed for `cargo test`.
  tauri:
    name: tauri (unit tests + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.90.0
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy
          rustup default 1.90.0

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo clippy -D warnings
        run: cargo clippy -p gorm-generate --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p gorm-generate
